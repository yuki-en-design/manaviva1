<html lang="ja">

<head>

<meta charset="UTF-8">

<title>探究データビューア (参考サイト)</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root { --accent: #999; }

body {

  font-family: 'Noto Sans JP', sans-serif;

  background: #f0f0eb;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  overflow: hidden;

}



/* ── TOPBAR ── */

.topbar {

  width: 100%;

  flex-shrink: 0;

  background: #fff;

  border-bottom: 1px solid #e4e0da;

  display: flex;

  flex-direction: row;

  align-items: center;

  justify-content: space-between;

  padding: 12px 32px;

  box-shadow: 0 4px 15px rgba(0,0,0,0.03);

  z-index: 10;

}

.topbar-header { display: flex; flex-direction: column; }

.topbar-title { font-size: 10px; font-weight: 900; letter-spacing: 0.1em; color: #888; }

.topbar-subtitle { font-size: 16px; font-weight: 900; color: #222; line-height: 1.4; margin-top: 2px; }

.field { display: flex; flex-direction: row; align-items: center; gap: 16px; }

.field label { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: #444; white-space: nowrap; }

.field select {

  font-family: 'Noto Sans JP', sans-serif;

  font-size: 14px;

  border: 2px solid #ddd;

  border-radius: 6px;

  padding: 8px 16px;

  background: #fafafa;

  color: #222;

  transition: all 0.2s ease;

  outline: none;

  width: 320px;

  cursor: pointer;

}

.field select:focus { border-color: var(--accent, #0D7A6E); background: #fff; }



/* ── PREVIEW ── */

.preview-panel {

  flex: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #e9e7e2;

  position: relative;

  padding: 16px;

}

.slide-scale-container { transform-origin: center center; transition: transform 0.1s ease-out; }



/* ── SLIDE ── */

.slide {

  width: 960px;

  height: 540px;

  background: #fff;

  box-shadow: 0 16px 40px rgba(0,0,0,0.15);

  display: flex;

  overflow: hidden;

}



/* 左カラム */

.slide-left {

  width: 300px;

  height: 100%;

  background: var(--accent, #999);

  display: flex;

  flex-direction: column;

  color: #fff;

  transition: background-color 0.3s;

}

.slide-img-wrap { width: 100%; height: 180px; background: rgba(0,0,0,0.1); position: relative; }

.slide-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }

.slide-img-placeholder {

  position: absolute; top: 0; left: 0; right: 0; bottom: 0;

  display: flex; align-items: center; justify-content: center;

  color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500;

}

.slide-left-content { padding: 24px; flex: 1; display: flex; flex-direction: column; }

.slide-vision { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); margin-bottom: 12px; }

.slide-q-label {

  font-size: 12px; font-weight: 900; color: #fff; margin-bottom: 8px;

  background: rgba(0,0,0,0.2); display: inline-block; padding: 4px 8px; border-radius: 4px;

}

.slide-q-text { font-size: 16px; font-weight: 900; line-height: 1.6; }



/* 右カラム */

.slide-right {

  flex: 1;

  padding: 16px 20px 14px;

  background: #faf9f7;

  display: flex;

  flex-direction: column;

  gap: 10px;

}



/* ── STEP0 ── */

.step0-box {

  background: #fff;

  border-radius: 8px;

  border-left: 4px solid var(--accent, #ccc);

  padding: 10px 14px;

  box-shadow: 0 1px 4px rgba(0,0,0,0.05);

  display: none;

  flex-direction: column;

  gap: 5px;

  flex-shrink: 0;

}

.step0-box.visible { display: flex; }

.step0-header {

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 0.12em;

  color: var(--accent, #999);

  margin-bottom: 2px;

}

.step0-questions { display: flex; flex-direction: column; gap: 4px; }

.step0-q {

  display: flex;

  gap: 6px;

  align-items: flex-start;

}

.step0-num {

  font-size: 9px;

  font-weight: 900;

  color: #fff;

  background: var(--accent, #999);

  border-radius: 50%;

  width: 14px; height: 14px;

  display: flex; align-items: center; justify-content: center;

  flex-shrink: 0;

  margin-top: 1px;

}

.step0-text { font-size: 11px; color: #333; line-height: 1.5; }

.step0-reason {

  margin-top: 4px;

  padding: 5px 10px;

  background: #f5f4f0;

  border-radius: 4px;

  font-size: 10px;

  color: #888;

  font-weight: 500;

}



/* 調べること ヘッダー */

.slide-right-header {

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  border-bottom: 2px solid #eaeaea;

  padding-bottom: 6px;

  flex-shrink: 0;

}

.slide-right-title { font-size: 16px; font-weight: 900; color: var(--accent, #666); letter-spacing: 0.1em; }



/* 調べること グリッド */

.grid-investigation {

  display: grid;

  grid-template-columns: repeat(5, 1fr);

  gap: 6px;

  flex: 1;

  min-height: 0;

}

.card-investigation {

  background: #fff;

  border-radius: 6px;

  padding: 6px 8px;

  box-shadow: 0 1px 4px rgba(0,0,0,0.04);

  border-top: 3px solid var(--accent, #ccc);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  transition: border-color 0.3s;

}

.item-who { grid-column: span 1; }

.item-where { grid-column: span 1; }

.item-when { grid-column: span 1; }

.item-what { grid-column: span 1; }

.item-howmuch { grid-column: span 1; }

.card-title { font-size: 12px; font-weight: 900; color: var(--accent, #999); margin-bottom: 1px; font-family: Arial, Helvetica, sans-serif; }

.card-sub-q { font-size: 8.5px; color: #777; font-weight: 700; margin-bottom: 4px; line-height: 1.3; padding-bottom: 3px; border-bottom: 1px dashed #eee; }

.card-text { font-size: 12px; line-height: 1.35; color: #333; overflow: hidden; word-break: break-all; }

.card-text.empty { color: #bbb; font-style: italic; }





/* 参考サイト */

.reference-area {

  padding: 8px 12px;

  background: #f0efe9;

  border-radius: 6px;

  display: flex;

  align-items: flex-start;

  gap: 10px;

  border-left: 4px solid #bbb;

  flex: 0.8;

  min-height: 0;

}

.ref-label { font-size: 10px; font-weight: 900; color: #666; white-space: nowrap; background: #e4e0da; padding: 4px 8px; border-radius: 4px; line-height: 1.3; text-align: center; }

.ref-links { display: flex; flex-wrap: wrap; gap: 4px 10px; padding-top: 2px; flex: 1; }

.ref-text-item { font-size: 12px; color: #444; line-height: 1.4; font-weight: 500; }

.keyword-item { font-size: 12px; color: #fff; background-color: var(--accent, #999); padding: 2px 6px; border-radius: 10px; line-height: 1.4; font-weight: 700; }

</style>

</head>

function autoFitText(el, maxFontSize) {
  let fontSize = maxFontSize;
  el.style.fontSize = fontSize + 'px';
  while (el.scrollHeight > el.clientHeight && fontSize > 8) {
    fontSize -= 0.5;
    el.style.fontSize = fontSize + 'px';
  }
}

function adjustScale() {

  const panel = document.getElementById('preview-panel');

  const container = document.getElementById('scale-container');

  const scale = Math.min((panel.clientWidth - 24) / 960, (panel.clientHeight - 24) / 540, 1);

  container.style.transform = `scale(${scale})`;

}

  document.getElementById('slide-vision').textContent = q.vision;

  document.getElementById('slide-q-label').textContent = q.qnum;

  document.getElementById('slide-q-text').textContent = q.q;



  const wrap = document.getElementById('slide-img-wrap');

  if (q.image) {

    const proxy = "https://images.weserv.nl/?url=" + encodeURIComponent(q.image.replace(/^https?:\/\//, ''));

    wrap.innerHTML = `<img class="slide-img" src="${proxy}" alt="" crossorigin="anonymous" onerror="this.src='${q.image}'; this.removeAttribute('crossorigin');">`;

  }



  // STEP0

  const box = document.getElementById('step0-box');

  if (s) {

    document.getElementById('step0-q1').textContent = s.q1;

    document.getElementById('step0-q2').textContent = s.q2;

    box.classList.add('visible');

  } else {

    box.classList.remove('visible');

  }



  // 調べること

  const w = q.w5h2;

  ['who','where','when','what','howmuch'].forEach(k => {

    document.getElementById(`q-${k}`).textContent = w[k].q;

    const t = document.getElementById(`t-${k}`);

    t.textContent = w[k].a;

    t.classList.remove('empty');

    autoFitText(t, 12);

  });



  // 参考サイト＆キーワード

  const refArea = document.getElementById('reference-area');

  const refLinks = document.getElementById('ref-links');

  refLinks.innerHTML = '';

  const refs = ['who','where','when','what','howmuch']

    .map(k => q.w5h2[k] && q.w5h2[k].r ? q.w5h2[k].r : null)

    .filter(Boolean);

  if (refs.length || (q.keywords && q.keywords.length)) {

    refs.forEach(r => {

      const d = document.createElement('div');

      d.className = 'ref-text-item';

      d.textContent = '・' + r;

      refLinks.appendChild(d);

    });

    q.keywords.forEach(k => {

      const s = document.createElement('span');

      s.className = 'keyword-item';

      s.textContent = '#' + k;

      refLinks.appendChild(s);

    });

    refArea.style.display = 'flex';

    autoFitText(refLinks, 12);

  } else {

    refArea.style.display = 'none';

  }

}



function resetSlide() {

  document.documentElement.style.setProperty('--accent', '#999');

  document.getElementById('slide-vision').textContent = 'VISION';

  document.getElementById('slide-q-label').textContent = 'Q. --';

  document.getElementById('slide-q-text').innerHTML = 'テーマを選ぶと<br>ここに問いが表示されます';

  document.getElementById('slide-img-wrap').innerHTML = '<div class="slide-img-placeholder">NO IMAGE</div>';

  document.getElementById('step0-box').classList.add('visible');

  document.getElementById('step0-q1').textContent = '（テーマを選ぶと表示されます）';

  document.getElementById('step0-q2').textContent = '（テーマを選ぶと表示されます）';

  document.getElementById('reference-area').style.display = 'flex';

  const refLinks = document.getElementById('ref-links');

  refLinks.innerHTML = '<div class="ref-text-item">（テーマを選ぶと表示されます）</div>';

  autoFitText(refLinks, 12);

  ['who','where','when','what','howmuch'].forEach(k => {

    document.getElementById(`q-${k}`).textContent = '問い';

    const t = document.getElementById(`t-${k}`);

    t.textContent = 'テーマを選ぶと表示されます';

    t.classList.add('empty');

    autoFitText(t, 12);

  });

}
