<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
  background: #f0f4f8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 10px;
  overflow: hidden;
}
.progress-bar {
  width: 100%;
  max-width: 400px;
  height: 4px;
  background: #d9e2ec;
  border-radius: 2px;
  margin-bottom: 10px;
}
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.counter {
  color: #627d98;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 10px;
  width: 100%;
  max-width: 400px;
  text-align: left;
}
.stage {
  width: 100%;
  max-width: 400px;
  position: relative;
  min-height: 580px;
}
.card {
  position: absolute;
  width: 100%;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  cursor: grab;
  transition: transform 0.08s ease, opacity 0.3s ease;
  top: 0; left: 0;
  background: #fffdfc;
  user-select: none;
}
.card:active { cursor: grabbing; }
.card.animating {
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
}
.card.behind { transform: scale(0.92) translateY(15px); z-index: 5; opacity: 0.4; pointer-events: none; }
.card.front { z-index: 20; }
.card-header { padding: 18px 20px 14px; }
.vision-badge {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 8px;
}
.q-num { font-size: 10px; color: rgba(255,255,255,0.8); font-weight: 700; margin-bottom: 4px; }
.q-text { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.4; }
.card-body { padding: 15px 18px; }
.img-box {
  width: 100%;
  height: 130px;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
  background: #eee;
}
.img-box img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.section-label { font-size: 9px; font-weight: 800; color: #888; margin-bottom: 6px; letter-spacing: 0.1em; }
.keywords { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 15px; }
.kw {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
}
.divider { border: none; border-top: 1px solid #eee; margin-bottom: 15px; }
.think-box { border-radius: 10px; padding: 14px; font-size: 12.5px; line-height: 1.7; }
.think-label { font-size: 10px; font-weight: 800; margin-bottom: 5px; }
.nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  margin-top: 25px;
  width: 100%;
  z-index: 100;
  position: relative;
}
.nav-btn {
  background: #fff;
  border: 1px solid #d9e2ec;
  color: #333;
  border-radius: 50%;
  width: 55px; height: 55px;
  font-size: 24px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  transition: all 0.2s;
}
.nav-btn:active { transform: scale(0.9); background: #f8f9fa; }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
.img-box { position: relative; }
.credit { position: absolute; right: 4px; bottom: 2px; font-size: 7px; color: rgba(255,255,255,0.8); text-shadow: 0 0 2px rgba(0,0,0,0.7); text-decoration: none; }
</style>

function render() {
  current = Math.max(0, Math.min(current, CARDS.length - 1));
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (current + 1 < CARDS.length) {
    const behind = makeCard(current + 1);
    behind.classList.add('behind');
    stage.appendChild(behind);
  }
  const front = makeCard(current);
  front.classList.add('front');
  stage.appendChild(front);
  setupDrag(front);
  const prog = document.getElementById('prog');
  prog.style.width = ((current + 1) / CARDS.length * 100) + '%';
  prog.style.background = CARDS[current].color;
  document.getElementById('counter').textContent = (current + 1) + ' / ' + CARDS.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === CARDS.length - 1;
}

function makeCard(i) {
  const c = CARDS[i];
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-header" style="background:${c.color}">
      <div class="vision-badge">${c.vision}</div>
      <div class="q-num">${c.qnum}</div>
      <div class="q-text">${c.q}</div>
    </div>
    <div class="card-body">
      <div class="img-box"><img src="${c.image}" alt="img" style="object-position:${c.imgPos || 'center'}" onerror="this.parentElement.style.background='#ccc';this.style.display='none'"><a class="credit" href="${CREDITS[i].u}" target="_blank" rel="noopener">${CREDITS[i].t}</a></div>
      <div class="section-label">キーワード</div>
      <div class="keywords">
        ${c.keywords.map(k => `<span class="kw" style="color:${c.kwColor};border-color:${c.kwBorder}">${k}</span>`).join('')}
      </div>
      <div class="divider"></div>
      <div class="think-box" style="background:${c.thinkBg};border:1px dashed ${c.thinkBorder}">
        <div class="think-label" style="color:${c.thinkLabel}">💡 考えてみよう</div>
        <span style="color:${c.thinkText}">${c.think}</span>
      </div>
    </div>
  `;
  return el;
}

function setupDrag(card) {
  card.addEventListener('mousedown', e => {
    if (isAnimating) return;
    startX = e.clientX; isDragging = true; dragCard = card;
  });
  card.addEventListener('touchstart', e => {
    if (isAnimating) return;
    startX = e.touches[0].clientX; isDragging = true; dragCard = card;
  }, { passive: true });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMoveT, { passive: true });
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

function onMove(e) {
  if (!isDragging || !dragCard || isAnimating) return;
  const dx = e.clientX - startX;
  dragCard.style.transform = `translateX(${dx}px) rotate(${dx * 0.05}deg)`;
}
function onMoveT(e) {
  if (!isDragging || !dragCard || isAnimating) return;
  const dx = e.touches[0].clientX - startX;
  dragCard.style.transform = `translateX(${dx}px) rotate(${dx * 0.05}deg)`;
}

function onEnd(e) {
  if (!isDragging || !dragCard || isAnimating) return;
  isDragging = false;
  const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const dx = clientX - startX;
  if (Math.abs(dx) > 100) {
    const dir = dx > 0 ? 1 : -1;
    if ((dir === 1 && current === 0) || (dir === -1 && current === CARDS.length - 1)) {
      cancelDrag();
    } else {
      animateOut(dragCard, dir);
    }
  } else {
    cancelDrag();
  }
  dragCard = null;
}

function cancelDrag() {
  if (!dragCard) return;
  dragCard.classList.add('animating');
  dragCard.style.transform = '';
  setTimeout(() => { if (dragCard) dragCard.classList.remove('animating'); }, 400);
}

function animateOut(el, dir) {
  if (isAnimating) return;
  isAnimating = true;
  el.classList.add('animating');
  el.style.transform = `translateX(${dir * 150}%) rotate(${dir * 20}deg)`;
  el.style.opacity = '0';
  setTimeout(() => {
    current = (dir === -1) ? current + 1 : current - 1;
    render();
    isAnimating = false;
  }, 400);
}

function go(dir) {
  if (isAnimating) return;
  if (dir === -1 && current === 0) return;
  if (dir === 1 && current === CARDS.length - 1) return;
  const front = document.querySelector('.front');
  if (front) animateOut(front, dir === 1 ? -1 : 1);
}

render();
</script>
</body>
</html>
